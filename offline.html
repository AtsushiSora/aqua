<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0e8f96">
    <title>AquaNote | オフライン</title>
    <link rel="icon" href="assets/icon-192.png" type="image/png">
    <style>
      :root {
        color-scheme: light;
        --ink: #152426;
        --muted: #667672;
        --aqua: #0e8f96;
        --aqua-dark: #0a5f63;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(246, 248, 246, 0.88), rgba(238, 246, 244, 0.96)),
          radial-gradient(circle at 24% 20%, rgba(14, 143, 150, 0.16), transparent 28%),
          #f6f8f6;
        color: var(--ink);
        font-family: "M PLUS Rounded 1c", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif;
      }

      main {
        width: min(460px, 100%);
        display: grid;
        gap: 14px;
        padding: 24px;
        border: 1px solid rgba(10, 95, 99, 0.16);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 18px 42px rgba(21, 36, 38, 0.1);
      }

      img {
        width: 64px;
        height: 64px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 1.45rem;
      }

      p {
        color: var(--muted);
        font-weight: 800;
      }

      a {
        width: fit-content;
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        padding: 0 16px;
        border-radius: 999px;
        background: var(--aqua-dark);
        color: white;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/icon-192.png" alt="" aria-hidden="true">
      <h1>オフラインです</h1>
      <p>通信が戻るとAquaNoteを再読み込みできます。保存済みの画面はブラウザのキャッシュから開ける場合があります。</p>
      <a href="./index.html">ホームへ戻る</a>
    </main>
  </body>
</html>
